#
# Profile Architecture & Relationships
#
# profile.agent.* (claude, antigravity, opencode)
#   └─ 1:1 profile.container.* (claude, antigravity, opencode)
#
# profile.kube.* (minimal, full, nushell, docs)   ← agent-agnostic MCP sets
#   └─ 0:N profile.mcp.* (nushell, docs-mcp-server)
#          └─ 1:1 profile.container.* (mcp-*)
#
# profile.docs.* (standalone: nushell, ansible, podman, claude-code, yazi)
#
# Design:
#  • Kube profiles define which MCP servers run alongside any agent.
#  • Agent profiles define the container image and data paths.
#  • The combination of agent + kube profile is chosen at launch time.
#  • Nested tables with implicit IDs from TOML keys.
#  • CLI accepts short form (claude) resolved to namespace.
#  • References use simple names without prefixes.
#

[agentonaut]
path = "."
default_agent = "antigravity"

# Antigravity CLI (agy) keeps its whole state under ~/.gemini, inherited from
# the Gemini CLI it replaces. It has no separate config file and no CLI command
# to register MCP servers, so config_path and mcp_command are unset. MCP servers
# are configured through ~/.gemini/config/mcp_config.json instead.
[profile.agent.antigravity]
container = "antigravity"
yaml_file = "conf/kube/antigravity.yaml"
data_path_host = "~/.local/share/agentonaut/antigravity"
data_path_container = "/home/antigravity/.gemini"
chat_base_path = "~/Documents/agentonaut/antigravity"

[profile.agent.claude]
container = "claude"
yaml_file = "conf/kube/claude.yaml"
data_path_host = "~/.local/share/agentonaut/claude"
data_path_container = "/home/claude/.claude"
config_path = "~/.config/agentonaut/claude/claude.json"
chat_base_path = "~/Documents/agentonaut/claude"
mcp_command = "claude mcp add --transport {transport} {name} {url}"

# OpenCode keeps config, data and state in data_path_host via XDG variables set
# in the image. Provider credentials are stored with "opencode auth login" or
# "/connect" in the TUI (e.g. OpenRouter with an API key) and land in the
# SQLite database data/opencode/opencode.db. Models use the provider prefix,
# e.g. openrouter/<provider>/<model>. MCP servers go into the global config,
# so the workspace repository stays untouched.
[profile.agent.opencode]
container = "opencode"
yaml_file = "conf/kube/opencode.yaml"
data_path_host = "~/.local/share/agentonaut/opencode"
data_path_container = "/home/opencode/.opencode"
chat_base_path = "~/Documents/agentonaut/opencode"
mcp_command = "opencode mcp add {name} --global --url {url}"

# Each agent gets its own pod, named "<pod_prefix>-<agent>". This lets several
# agents run side by side, for example antigravity for implementation and claude
# for review, each with an independent lifecycle and its own workspace.
#
# shared_pod_name is the long-lived pod holding MCP servers that all agents use.
# It lives in the same network, so agents reach it by pod name via Podman DNS.
[agentonaut.podman]
network = "agentonaut-network"
pod_prefix = "agentonaut"
shared_pod_name = "agentonaut-shared"


#
# Podman Kube YAML Profiles
#
# Agent-agnostic MCP sets: define which MCP servers run alongside any agent.
# The agent determines the container image; the kube profile determines the MCPs.
#
# tmp_dir holds the rendered pod YAML. Each agent renders to its own file inside
# this directory, so parallel launches do not overwrite each other.
[kube]
default_profile = "minimal"
tmp_dir = "/tmp/agentonaut"
template_dir = "conf/kube/templates"
shared_template = "shared-pod.yaml.j2"

[profile.kube.minimal]
description = "Agent only, no MCPs"
mcp_profiles = []

[profile.kube.full]
description = "Nushell + Docs MCP"
mcp_profiles = ["nushell", "docs-mcp-server"]

[profile.kube.nushell]
description = "Nushell MCP only"
mcp_profiles = ["nushell"]

[profile.kube.docs]
description = "Docs MCP only"
mcp_profiles = ["docs-mcp-server"]

# shared = false: the MCP runs as a sidecar inside the agent's own pod and is
#   reachable over the pod-local loopback. Use this for workspace-bound servers.
# shared = true: the MCP runs in the shared pod and is addressed by that pod's
#   DNS name. Use this for agent-neutral servers with host port mappings.
#
# mcp-nushell mounts the agent's workspace read-only, so it must stay pod-local.
[profile.mcp.nushell]
container = "mcp-nushell"
yaml_file = "conf/kube/mcp-nushell.yaml"
name = "mcp-nushell"
transport = "http"
shared = false
url = "http://mcp-nushell:8001/mcp"

# docs-mcp-server only mounts its index and the docs tree, both agent-neutral.
# Sharing it avoids indexing the same documentation twice and frees the fixed
# host ports 6280 and 6281, which no second pod could have bound.
[profile.mcp.docs-mcp-server]
container = "docs-mcp-server"
yaml_file = "conf/kube/docs-mcp-server.yaml"
name = "docs-mcp-server"
transport = "http"
shared = true
url = "http://agentonaut-shared:6280/mcp"
web_url = "http://127.0.0.1:6280"

#
# Documentation Profiles
#
# Profiles for downloading docs repositories and indexing them with docs-mcp-server.
#
# repo:         Git repository URL (optional; omit for web-only docs)
# target_dir:   Local directory to clone repository into
# branch:       Git branch to checkout (default: "main")
# depth:        Optional shallow clone depth (null = full clone)
# description:  Human-readable description
# library_name: Name used to register the library in docs-mcp-server
# mcp_url:      URL passed to docs-mcp-server scrape (file:/// or https://)

[docs]
base_dir = "~/Documents/offline-documentation"

[profile.docs.nushell]
repo = "https://github.com/nushell/nushell.github.io.git"
target_dir = "nushell"
branch = "main"
depth = 1
description = "Nushell official documentation website"
library_name = "nushell-documentation"
mcp_url = "file:///docs/nushell/book"

[profile.docs.ansible]
