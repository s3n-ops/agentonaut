---
apiVersion: v1
kind: Pod
metadata:
  name: antigravity-pod
  labels:
    app: antigravity
  annotations:
    io.podman.annotations.userns: keep-id
    container.apparmor.security.beta.kubernetes.io/antigravity: unconfined
    container.seccomp.security.alpha.kubernetes.io/antigravity: unconfined
spec:
  containers:
    - name: antigravity
      image: localhost/antigravity:latest
      stdin: true
      tty: true
      volumeMounts:
        - name: workspace
          mountPath: /workspace:z
        - name: agent-data
          mountPath: /home/antigravity/.gemini:z
      securityContext:
        allowPrivilegeEscalation: false
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: Unconfined
        capabilities:
          drop:
            - NET_RAW
      imagePullPolicy: Never

  volumes:
    - name: workspace
      hostPath:
        path: /workspace
        type: Directory
    - name: agent-data
      hostPath:
        path: ~/.local/share/agentonaut/antigravity
        type: DirectoryOrCreate

  restartPolicy: Never
  dnsPolicy: ClusterFirst
  shareProcessNamespace: false
